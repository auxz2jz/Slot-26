name: Build Relay One Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'multi-radio.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Relay-One-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish first direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v0.1.1"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Kept existing APK signature and artifact."
          else
            gh release create "$tag"               'android/app/build/outputs/apk/debug/app-debug.apk#Relay-One-v0.1.1.apk'               --target "${{ github.sha }}"               --title "Relay One Android APK v0.1.1"               --notes "Android v0.1.1 test build: request microphone permission before initializing WebView, grant MODIFY_AUDIO_SETTINGS, use communication audio routing, and add microphone capture fallback diagnostics. Debug-signed with ephemeral key; uninstall earlier versions if Android rejects an update."
          fi
